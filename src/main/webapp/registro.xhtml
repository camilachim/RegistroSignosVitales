<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Registro de Personas</title>
</h:head>

<h:body style="
    background-image: url('imagen/registro.png');
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center center;
    height: 100vh;
    width: 100vw;
    margin: 0;
    padding: 0;">

    <style>
        input[type="text"],
        input[type="password"],
        textarea,
        select {
            background-color: #b3d9ff;
            border: 1px solid #7cb6fb;
            border-radius: 5px;
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-size: 1em;
        }
    </style>

    <!-- Contenedor centrado -->
    <table width="100%" height="75%">
        <tr>
            <td align="center" valign="middle">

                <!-- Cuadro transparente -->
                <div style="
                    background-color: rgba(124, 182, 251, 0.75);
                    padding: 30px;
                    border-radius: 15px;
                    box-shadow: 3px 3px 15px rgba(0,0,0,0.4);
                    min-width: 400px;
                    max-width: 600px;
                    text-align: left;">


                    <h1 style="text-align:center;">Registro de Pacientes</h1>

                    <!-- Mensajes de JSF -->
                    <h:messages globalOnly="true" style="color:red" />

                    <!-- Formulario -->
                    <h:form>
                        <h:panelGrid columns="2" cellpadding="5">

                            <h:outputLabel value="Identificación:" for="identificacion" />
                            <h:inputText id="identificacion"
                                         value="#{personaBean.persona.identificacion}"
                                         required="true"/>

                            <h:outputLabel value="Nombres:" for="nombres" />
                            <h:inputText id="nombres"
                                         value="#{personaBean.persona.nombres}"
                                         required="true"/>

                            <h:outputLabel value="Apellidos:" for="apellidos" />
                            <h:inputText id="apellidos"
                                         value="#{personaBean.persona.apellidos}"
                                         required="true"/>

                            <h:outputLabel value="Sexo:" for="sexo" />
                            <h:selectOneMenu id="sexo"
                                             value="#{personaBean.persona.sexo}">
                                <f:selectItem itemLabel="Seleccione" itemValue="" />
                                <f:selectItem itemLabel="Masculino" itemValue="Masculino" />
                                <f:selectItem itemLabel="Femenino" itemValue="Femenino" />
                            </h:selectOneMenu>

                        </h:panelGrid>

                        <h:panelGrid columns="2" cellpadding="5">
                            <h:outputLabel value="Fecha de nacimiento:" for="fechaNacimiento" />

                            <h:inputText id="fechaNacimiento"
                                         type="date"
                                         value="#{personaBean.persona.fechaNacimiento}">
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:inputText>
                        </h:panelGrid>


                        <h:panelGrid columns="2" cellpadding="5">

                            <h:outputLabel value="País:" for="pais" />
                            <h:inputText id="pais"
                                         value="#{personaBean.persona.pais}" />

                            <h:outputLabel value="Ciudad:" for="ciudad" />
                            <h:inputText id="ciudad"
                                         value="#{personaBean.persona.ciudad}" />

                            <h:outputLabel value="Dirección:" for="direccion" />
                            <h:inputText id="direccion"
                                         value="#{personaBean.persona.direccion}" />

                            <h:outputLabel value="Email:" for="email" />
                            <h:inputText id="email"
                                         value="#{personaBean.persona.email}" />

                            <h:outputLabel value="Teléfono:" for="telefono" />
                            <h:inputText id="telefono"
                                         value="#{personaBean.persona.telefono}" />

                        </h:panelGrid>

                    <h:panelGroup style="margin-top:20px; text-align:center;">
                        <h:commandButton value="Registrar"
                                         action="#{personaBean.registrar}"
                                         style="margin-right:10px;" />

                        <h:commandButton value="⬅ Volver al inicio"
                                         action="login?faces-redirect=true"
                                         immediate="true" />
                    </h:panelGroup>
                    </h:form>

                </div>
            </td>
        </tr>
    </table>

</h:body>
</html>
