<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Lista de Pacientes</title>
</h:head>

<h:body style="
    background-image: url('imagen/registro.png');
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center center;
    height: 100vh;
    width: 100vw;
    margin: 0;
    padding: 0;">

    <style>
        input[type="text"],
        input[type="password"],
        textarea,
        select {
            background-color: #b3d9ff;
            border: 1px solid #7cb6fb;
            border-radius: 5px;
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-size: 1em;
        }
        .cuadro-transparente {
            background-color: rgba(124, 182, 251, 0.75);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 3px 3px 15px rgba(0,0,0,0.4);
            min-width: 400px;
            max-width: 800px;
            text-align: left;
            margin-bottom: 30px;
        }
        h2 {
            text-align: center;
        }
    </style>

    <!-- Contenedor centrado -->
    <table width="100%" height="75%">
        <tr>
            <td align="center" valign="middle">

                <!-- Cuadro transparente -->
                <div class="cuadro-transparente">

                    <h2>Pacientes Registrados</h2>

                    <h:form>
                        <h:dataTable value="#{personaBean.listaPacientes}" var="p" border="1" width="100%">

                            <h:column>
                                <f:facet name="header">Nombres</f:facet>
                                <h:commandLink value="#{p.nombres}"
                                               action="#{controladorSignosVitales.cargarPaciente(p)}" />
                            </h:column>

                            <h:column>
                                <f:facet name="header">Apellidos</f:facet>
                                #{p.apellidos}
                            </h:column>

                            <h:column>
                                <f:facet name="header">Identificación</f:facet>
                                #{p.identificacion}
                            </h:column>

                            <h:column>
                                <f:facet name="header">Edad</f:facet>
                                #{p.edad}
                            </h:column>

                            <h:column>
                                <f:facet name="header">Ciudad</f:facet>
                                #{p.ciudad}
                            </h:column>

                        </h:dataTable>
                    </h:form>


                </div>

            </td>
        </tr>
    </table>

</h:body>
</html>
