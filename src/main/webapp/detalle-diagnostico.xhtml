<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<f:metadata>
    <f:viewParam name="idDiagnostico" value="#{observacionBean.idDiagnosticoSeleccionado}" />
    <f:viewParam name="idPaciente" value="#{observacionBean.idPaciente}" />
    <f:viewAction action="#{observacionBean.cargarDetalleDiagnostico}" />
</f:metadata>

<h:head>
    <title>Reporte de Diagnóstico</title>
</h:head>

<h:body style="
    background-image: url('imagen/registro.png');
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center center;
    height: 100vh;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;">

    <style>
        .cuadro-transparente {
            background-color: rgba(124, 182, 251, 0.75);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 3px 3px 15px rgba(0,0,0,0.4);
            width: 90%;
            max-width: 650px;
        }
        .label-reporte { font-weight: bold; color: #333; }
        .valor-reporte { font-size: 1.1em; color: #000; }
    </style>

    <div class="cuadro-transparente">
        
        <div style="text-align: center; color: #000; margin-bottom: 20px;">
            <i class="pi pi-file-o" style="font-size: 2.5rem;"></i><br/>
            <h2 style="margin-top: 10px;">Reporte de Diagnóstico</h2>
        </div>

        <p:divider style="margin-bottom: 30px;"/>

        <h:form>
            <h:panelGroup rendered="#{observacionBean.diagnosticoDetalle == null}">
                <h3 style="color:red; text-align:center;">No se encontró información.</h3>
            </h:panelGroup>

            <h:panelGroup rendered="#{observacionBean.diagnosticoDetalle != null}" style="line-height: 1.8;">
                
                <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank" columnClasses="ui-g-4 label-reporte, ui-g-8 valor-reporte">
                    <h:outputText value="Paciente:" />
                    <h:outputText value="#{observacionBean.diagnosticoDetalle.paciente.nombres} #{observacionBean.diagnosticoDetalle.paciente.apellidos}" />

                    <h:outputText value="Cédula:" />
                    <h:outputText value="#{observacionBean.diagnosticoDetalle.paciente.identificacion}" />

                    <h:outputText value="Fecha y Hora:" />
                    <h:outputText value="#{observacionBean.diagnosticoDetalle.fechaRegistro}" style="font-weight: bold;">
                        <f:convertDateTime pattern="dd/MM/yyyy - HH:mm:ss" type="localDateTime"/>
                    </h:outputText>

                    <h:outputText value="Tipo:" />
                    <h:outputText value="#{observacionBean.diagnosticoDetalle.tipo}" style="font-weight:bold;"/>
                </p:panelGrid>
                
                <div style="margin-bottom: 15px;">
                    <span class="label-reporte">Motivo:</span><br/>
                    <span class="valor-reporte">#{observacionBean.diagnosticoDetalle.descripcion}</span>
                </div>

                <h:panelGroup rendered="#{not empty observacionBean.diagnosticoDetalle.observacion}" layout="block" style="margin-bottom: 15px;">
                    <span class="label-reporte">Observaciones:</span><br/>
                    <span class="valor-reporte">#{observacionBean.diagnosticoDetalle.observacion}</span>
                </h:panelGroup>
                
                <div style="background-color: rgba(255,255,255,0.3); padding: 15px; border-radius: 8px; border: 1px solid #7cb6fb;">
                    <span class="label-reporte">Tratamiento / Receta:</span><br/>
                    <span class="valor-reporte" style="font-style: italic;">#{observacionBean.diagnosticoDetalle.tratamiento}</span>
                </div>

            </h:panelGroup>

            <div style="text-align: center; margin-top: 40px;">
                <p:button value="Volver" outcome="evaluacion-clinica" icon="pi pi-arrow-left" styleClass="ui-button-secondary" style="width: 150px;">
                    <f:param name="idPaciente" value="#{observacionBean.paciente.identificacion}" />
                </p:button>
            </div>
        </h:form>
    </div>

</h:body>
</html>
